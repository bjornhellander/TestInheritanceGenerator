version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The Roslyn version referenced by the generator sets the minimum compiler/SDK version
      # that consumers need, so it should only be raised deliberately.
      - dependency-name: "Microsoft.CodeAnalysis"
      - dependency-name: "Microsoft.CodeAnalysis.Common"
    groups:
      nuget:
        patterns:
          - "*"
